name: camaleon_db_port
description: Camaleon MyISAM to SQLite seed importer for POS demo/localdb/hub.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  dartz: ^0.10.1
  sqlite3: ^3.8.0
  path: ^1.9.1
  file_picker: ^13.3.2
  mysql1: ^0.22.0
  intl: ^0.20.3
  desktop_drop: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/camaleon_sqlite_database
